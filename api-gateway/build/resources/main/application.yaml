spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: category-service-route
              uri: lb://category-service
              predicates:
                - Path=/api/categories/**
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
